# End-to-End TPU CI Workflow (GKE Cloud TPU v6e, Qwen3-0.6B)
#
# Target GKE Cluster:
#   export CLUSTER_NAME="jialeic-ci-v6e8-2s-spot"
#   export REGION="us-central2"
#   export PROJECT="tpu-pytorch"
#   gcloud container clusters get-credentials $CLUSTER_NAME --region $REGION --project $PROJECT --dns-endpoint
#
# Three independent CI tiers, named by TPU chip count. Each runs as its own job with its own
# short-lived RayCluster; add new tests to the matching tier in tests/special_tpu/run_tpu_e2e_ci.sh.
#   v6e 1-chip - TPU platform tests (whole ct6e-standard-1t node): torch_tpu import / to(device) /
#                matmul / autograd / TPU-vs-CPU MLP forward+backward.
#   v6e 4-chip - trainer tests (1 x v6e-4 subslice): GSM8K SFT, TorchTitan FSDP2
#                (mirrors e2e_sft_llm.yml).
#   v6e 8-chip - RL tests (2 x v6e-4 subslices): GSM8K GRPO, 4-chip TorchTitan trainer + 4-chip
#                vLLM rollout, V1 separate-async (mirrors e2e_v1_separate_async.yml).
# A single v6e host (4 chips) is the smallest multi-chip unit: libtpu cannot open an ICI session
# on a 2-chip subset of a host. 1 chip comes from a dedicated 1x1 node pool.
#
# tests/special_tpu/run_tpu_e2e_ci.sh provisions the tier's RayCluster through the tier's Kueue
# LocalQueue (`verl-tpu-ci-{1chip,4chip,8chip}`, FIFO per tier), so concurrent jobs queue for TPU
# quota instead of fighting for hosts, runs the tier's tests, and deletes the cluster on exit. The
# final `if: always()` step deletes it again in case the job was cancelled.

name: e2e_tpu

on:
  workflow_dispatch:
    inputs:
      test_tier:
        description: "TPU CI tier to execute (all, v6e-1chip, v6e-4chip, or v6e-8chip)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - v6e-1chip
          - v6e-4chip
          - v6e-8chip
      smoke_test:
        description: "Run fast CI smoke configuration (SMOKE_TEST=1)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "0"
      runner_type:
        description: "GitHub runner label (self-hosted or ubuntu-latest)"
        required: false
        default: "self-hosted"
        type: string
  push:
    branches:
      - main
      - tpu-main*
      - tpu_sft
      - v0.*
    paths:
      - ".github/workflows/e2e_tpu.yml"
      - "examples/tpu/**"
      - "tests/special_tpu/**"
      - "verl/checkpoint_engine/**"
      - "verl/experimental/separation/**"
      - "verl/plugin/platform/**"
      - "verl/trainer/sft_trainer_ray.py"
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/ppo/**"
      - "verl/trainer/config/**"
      - "verl/workers/engine/torchtitan/**"
      - "verl/workers/rollout/vllm_rollout/**"
      - "verl/workers/utils/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/e2e_tpu.yml"
      - "examples/tpu/**"
      - "tests/special_tpu/**"
      - "verl/checkpoint_engine/**"
      - "verl/experimental/separation/**"
      - "verl/plugin/platform/**"
      - "verl/trainer/sft_trainer_ray.py"
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/ppo/**"
      - "verl/trainer/config/**"
      - "verl/workers/engine/torchtitan/**"
      - "verl/workers/rollout/vllm_rollout/**"
      - "verl/workers/utils/**"

# A new commit on the same PR cancels its own stale run (its RayClusters are torn down by
# the always() step). Different PRs never cancel each other; their RayClusters wait in the
# Kueue queue until TPU quota frees up.
concurrency:
  group: e2e-tpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/tpu-main') && github.ref != 'refs/heads/tpu_sft' }}

permissions:
  contents: read
  id-token: write

env:
  CLUSTER_NAME: "jialeic-ci-v6e8-2s-spot"
  REGION: "us-central2"
  PROJECT: "tpu-pytorch"
  RAY_NAMESPACE: "default"
  KUEUE_QUEUE_PREFIX: "verl-tpu-ci"
  QUEUE_TIMEOUT_MINS: "90"
  SMOKE_TEST: ${{ github.event.inputs.smoke_test || '1' }}
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  select_tiers:
    name: Select TPU tiers
    runs-on: ubuntu-latest
    outputs:
      tiers: ${{ steps.select.outputs.tiers }}
    steps:
      - id: select
        env:
          SELECTED: ${{ github.event.inputs.test_tier || 'all' }}
        run: |
          all='[{"tier":"v6e-1chip","name":"v6e 1-chip","tests":"TPU platform tests"},
                {"tier":"v6e-4chip","name":"v6e 4-chip","tests":"trainer tests"},
                {"tier":"v6e-8chip","name":"v6e 8-chip","tests":"RL tests"}]'
          if [[ "${SELECTED}" == "all" ]]; then
            echo "tiers=$(jq -c . <<<"${all}")" >> "${GITHUB_OUTPUT}"
          else
            echo "tiers=$(jq -c --arg t "${SELECTED}" '[.[] | select(.tier == $t)]' <<<"${all}")" >> "${GITHUB_OUTPUT}"
          fi

  e2e_tpu:
    name: ${{ matrix.name }} (${{ matrix.tests }})
    needs: select_tiers
    runs-on: ${{ github.event.inputs.runner_type || vars.TPU_CI_RUNNER || 'self-hosted' }}
    # Includes up to QUEUE_TIMEOUT_MINS of waiting in the Kueue queue for TPU quota.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select_tiers.outputs.tiers) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Authenticate to Google Cloud (Service Account Key or Workload Identity)
        if: ${{ env.GCP_SA_KEY != '' || env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK (when running outside GKE)
        if: ${{ env.GCP_SA_KEY != '' || env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin,kubectl"

      - name: Install Ray Job Submission CLI & kubectl
        run: |
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -sLO https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
            chmod +x kubectl
            mv kubectl /usr/local/bin/kubectl
          fi
          python3 -m pip install --upgrade pip
          python3 -m pip install --quiet "ray[default]"

      - name: Provision RayCluster, run ${{ matrix.tests }}, tear down
        run: bash tests/special_tpu/run_tpu_e2e_ci.sh ${{ matrix.tier }}

      - name: Tear down RayCluster (safety net for cancelled or crashed runs)
        if: ${{ always() }}
        run: bash tests/special_tpu/run_tpu_e2e_ci.sh teardown ${{ matrix.tier }}
