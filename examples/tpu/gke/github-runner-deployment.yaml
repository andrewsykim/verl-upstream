# Optional Self-Hosted GitHub Actions Runner Deployment on GKE (`jialeic-ci-v6e8-2s-spot`)
#
# Runs a lightweight runner pod on the CPU `default-pool` of `jialeic-ci-v6e8-2s-spot`
# using the `ray-ksa` ServiceAccount (Workload Identity -> `ray-tpu-gsa@tpu-pytorch.iam.gserviceaccount.com`).
#
# Usage:
#   1. Create secret with your GitHub Personal Access Token (PAT) or Runner Registration Token:
#      kubectl create secret generic github-runner-secret \
#        --from-literal=ACCESS_TOKEN="<YOUR_GITHUB_PAT>"
#   2. Update REPO_URL below if pointing to a fork, then apply:
#      kubectl apply -f examples/tpu/gke/github-runner-deployment.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-tpu-ci-runner
  namespace: default
  labels:
    app: github-tpu-ci-runner
spec:
  # Two workflow runs' worth of tier jobs (v6e 1-chip / 4-chip / 8-chip) can hold a runner at
  # once. A runner stays busy while its job waits in Kueue, so a few spares keep e.g. a 1-chip job
  # from waiting for a runner behind queued 8-chip jobs. Runners only submit work; TPU contention
  # is resolved by the per-tier Kueue LocalQueues `verl-tpu-ci-{1chip,4chip,8chip}` (see
  # tests/special_tpu/gke/kueue-tpu-ci.yaml).
  replicas: 6
  selector:
    matchLabels:
      app: github-tpu-ci-runner
  template:
    metadata:
      labels:
        app: github-tpu-ci-runner
      annotations:
        # The default-pool autoscaler would otherwise drain an under-used node and kill a
        # runner mid-job ("The runner has received a shutdown signal").
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: ray-ksa
      containers:
        - name: runner
          image: myoung34/github-runner:latest
          env:
            - name: REPO_URL
              value: "https://github.com/verl-project/verl"
            - name: RUNNER_SCOPE
              value: "repo"
            # Unique runner name per replica: <prefix>-<random suffix>.
            - name: RUNNER_NAME_PREFIX
              value: "gke-jialeic-ci-v6e8-2s-spot"
            - name: RANDOM_RUNNER_SUFFIX
              value: "true"
            - name: LABELS
              value: "self-hosted,linux,x64,tpu,tpu-v6e8-2s"
            - name: EPHEMERAL
              value: ""
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-secret
                  key: ACCESS_TOKEN
          resources:
            # Runners only run kubectl / the Ray job CLI; keep requests small so 6 fit on default-pool.
            requests:
              cpu: "2"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "32Gi"
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
